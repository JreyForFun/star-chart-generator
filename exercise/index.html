<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Star Chart</title>
     <link rel="stylesheet" href="style.css"/>
</head>
    <body>

        <!-- your code here -->
     <!-- Night sky : Drawing surface -->
     <canvas id="star-canvas"></canvas>

     <!-- Floating circle : Star name and magnitude -->
     <div id="tooltip" class="hidden">
          <span id="tooltip-name"></span>
          <span id="tooltip-mag"></span>
     </div>

     <!-- Info panel -->
     <div id="info-panel">
          <h1>✦ Star Chart</h1>
          <p id="star-count"></p>
          <p class="hint"></p>
     </div>

     <script src="script.js"></script>
    </body>
</html>
