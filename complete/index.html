<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Star Chart</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <canvas id="star-canvas"></canvas>

    <div id="tooltip" class="hidden">
        <span id="tooltip-name"></span>
        <span id="tooltip-mag"></span>
    </div>

    <div id="info-panel">
        <h1>✦ Star Chart</h1>
        <p id="star-count"></p>
        <p class="hint">Hover a star to inspect it</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
